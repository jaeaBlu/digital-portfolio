      <stop offset="50%" stop-color="#EFE6DD"/>
      <stop offset="100%" stop-color="#E2D4C6"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
