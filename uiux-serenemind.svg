<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="sereneBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F6F1"/>
      <stop offset="100%" stop-color="#EBE3D7"/>
    </linearGradient>
    <filter id="sereneShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#4A382A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="800" height="520" rx="20" fill="url(#sereneBg)"/>

  <g transform="translate(100, 40)" filter="url(#sereneShadow)">
    <rect width="270" height="440" rx="32" fill="#FFFFFF" stroke="#E2D4C6" stroke-width="2"/>
    <rect x="85" y="12" width="100" height="18" rx="9" fill="#3D3027"/>

    <text x="135" y="65" font-family="'Cormorant Garamond', Georgia, serif" font-size="18" font-style="italic" fill="#8C684E" text-anchor="middle">Mindful Pause</text>
    <text x="135" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#2D2520" text-anchor="middle">Box Breathing Cycle</text>

    <circle cx="135" cy="200" r="80" fill="#F4EAE0" opacity="0.6"/>
    <circle cx="135" cy="200" r="55" fill="#E8D8CA" opacity="0.7"/>
    <circle cx="135" cy="200" r="30" fill="#8C684E"/>
    <text x="135" y="205" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Inhale</text>

    <text x="135" y="315" font-family="'Courier New', monospace" font-size="20" font-weight="700" fill="#8C684E" text-anchor="middle">04 : 00</text>
    <text x="135" y="335" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#756559" text-anchor="middle">Seconds Remaining</text>

    <rect x="55" y="370" width="160" height="42" rx="21" fill="#8C684E"/>
    <text x="135" y="396" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Pause Session</text>
  </g>

  <g transform="translate(430, 40)" filter="url(#sereneShadow)">
    <rect width="270" height="440" rx="32" fill="#FFFFFF" stroke="#E2D4C6" stroke-width="2"/>
    <rect x="85" y="12" width="100" height="18" rx="9" fill="#3D3027"/>

    <text x="24" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#8C684E">SUNDAY, NOV 01</text>
    <text x="24" y="88" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#2D2520">How do you feel today?</text>

    <g transform="translate(20, 110)">
      <rect width="45" height="55" rx="10" fill="#FBF8F5" stroke="#E6DDD4"/>
      <text x="22" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" text-anchor="middle">✨</text>
      <text x="22" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#8C684E" text-anchor="middle">Grateful</text>

      <rect x="55" y="0" width="45" height="55" rx="10" fill="#8C684E"/>
      <text x="77" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" text-anchor="middle">🌿</text>
      <text x="77" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#FFFFFF" text-anchor="middle">Peaceful</text>

      <rect x="110" y="0" width="45" height="55" rx="10" fill="#FBF8F5" stroke="#E6DDD4"/>
      <text x="132" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" text-anchor="middle">⚡</text>
      <text x="132" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#8C684E" text-anchor="middle">Energetic</text>

      <rect x="165" y="0" width="45" height="55" rx="10" fill="#FBF8F5" stroke="#E6DDD4"/>
      <text x="187" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" text-anchor="middle">☕</text>
      <text x="187" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#8C684E" text-anchor="middle">Calm</text>
    </g>

    <text x="24" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#2D2520">Today's Reflection</text>
    <rect x="20" y="215" width="230" height="130" rx="12" fill="#FAF6F2" stroke="#E8DFD7"/>
    <text x="32" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#58483D">"Completed my UI/UX project review</text>
    <text x="32" y="258" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#58483D">and spent the afternoon refining my</text>
    <text x="32" y="276" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#58483D">digital portfolio. Grateful for progress</text>
    <text x="32" y="294" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#58483D">and creative clarity."</text>

    <rect x="20" y="365" width="230" height="44" rx="10" fill="#2D2520"/>
    <text x="135" y="392" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#FAF7F2" text-anchor="middle">Save Reflection</text>
  </g>
